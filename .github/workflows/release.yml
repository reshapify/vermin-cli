name: Release
# Publishes @vermin/cli to npm with provenance when a `v<version>` tag is pushed.
# Needs the NPM_TOKEN secret (an npm automation token with publish rights on @vermin).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check tag matches package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$PKG" ] || { echo "Tag $VERSION != package.json $PKG"; exit 1; }
      - run: npm run typecheck && npm test && npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
